name: Migrate Database and Deploy

on:
  push:
    branches:
      - main

# One-time setup this file relies on:
#
# 1. SUPABASE_DB_URL must be the *Session pooler* connection string, NOT the direct one:
#      postgresql://postgres.<project-ref>:<password>@aws-0-<region>.pooler.supabase.com:5432/postgres
#    Dashboard -> Connect -> "Session pooler". The direct string (db.<ref>.supabase.co) resolves to
#    IPv6 only, and GitHub-hosted runners have no outbound IPv6 - that is the ECONNREFUSED to a
#    2406:... address. Session mode (port 5432) is required; transaction mode (6543) can't run
#    migrations.
#
# 2. NETLIFY_BUILD_HOOK_URL: Netlify -> Site configuration -> Build & deploy -> Build hooks -> Add
#    (branch: main). Then set "Stop builds" under Build settings so a push to main no longer
#    triggers Netlify's own build - otherwise it starts in parallel with the migration instead of
#    after it, and new code can go live against the old schema.

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Apply Database Migrations to Supabase
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          supabase db push --db-url "$SUPABASE_DB_URL"

      # Only reached if the migration step succeeded. Netlify builds the app itself, exactly as it
      # does today - the hook just tells it when to start.
      - name: Trigger Netlify Deploy
        env:
          NETLIFY_BUILD_HOOK_URL: ${{ secrets.NETLIFY_BUILD_HOOK_URL }}
        run: |
          curl --fail --silent --show-error -X POST "$NETLIFY_BUILD_HOOK_URL"
